<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Nathaniel Murcin</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a1622" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a1622; --bg-2: #081019; --ink: #eef2f7; --ink-soft: #9fb0c4;
      --accent: #c9b477; --accent-deep: #b39c5c; --accent-ink: #0a1622;
    }
    :root[data-theme="light"] {
      --bg: #f5f6f8; --bg-2: #eaeef3; --ink: #13202e; --ink-soft: #46535f;
      --accent: #806629; --accent-deep: #6a541f; --accent-ink: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 2rem; gap: 0.4rem;
      font-family: "Inter", system-ui, sans-serif; color: var(--ink);
      background:
        radial-gradient(900px 700px at 78% 12%, rgba(201, 180, 119, 0.10), transparent 60%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    }
    .code {
      font-family: "Space Grotesk", sans-serif; font-weight: 700;
      font-size: clamp(4rem, 18vw, 9rem); line-height: 1; color: var(--accent);
      letter-spacing: -0.02em;
    }
    h1 { font-family: "Space Grotesk", sans-serif; font-size: clamp(1.3rem, 4vw, 1.9rem); margin-top: 0.6rem; }
    p { color: var(--ink-soft); max-width: 30rem; margin: 0.7rem 0 1.8rem; font-size: 1.05rem; }
    .home {
      display: inline-block; padding: 0.8rem 1.8rem; border-radius: 999px;
      background: var(--accent); color: var(--accent-ink); text-decoration: none;
      font-weight: 600; font-size: 0.98rem; transition: background 0.2s, transform 0.15s;
    }
    .home:hover { background: var(--accent-deep); transform: translateY(-2px); }
  </style>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) { /* localStorage blocked, fall back to default dark theme */ }
    })();
  </script>
</head>
<body>
  <div class="code" aria-label="Error 404">404</div>
  <h1>Page not found</h1>
  <p>That page doesn't exist. It may have been moved or the link was mistyped.</p>
  <a class="home" href="/">← Back to the portfolio</a>
</body>
</html>
